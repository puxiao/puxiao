    --ctrl: rgba(63, 63, 109, .08);
    --ctrl-on: rgba(63, 63, 109, .13);

  html[data-theme="dark"] {
    --bg: #16161b;
    --text: #c9c9dc;
    --text-dim: #7c7c95;
    --ink: #f2f2f5;
    --hl: rgba(111, 157, 255, .40);

  html { scroll-behavior: smooth; }
  body {

    margin: 0;
    padding: 7vh 22px;
    background-color: var(--bg);

  .top, .col, footer {

    margin-left: auto; margin-right: auto;
  }

  .top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin-bottom: 5em;
  }
  .mark {
    display: block;
    flex: none;
    width: 68px; height: 68px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--rule);

  .ctrls { display: flex; gap: 16px; align-items: center; }
  .seg { display: flex; gap: 3px; }
  .seg button {
    font: inherit; font-size: .82em; line-height: 1;
    padding: 5px 9px; border: 0; border-radius: 5px; cursor: pointer;
    background: transparent; color: var(--text-dim);
    transition: background .2s ease, color .2s ease;

  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] {
    background: var(--ctrl-on); color: var(--text); font-weight: 600;
  }

  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-size: clamp(2.6em, 7vw, 4.5em);

    font-style: italic;
    line-height: 1.08;
    letter-spacing: -.01em;
    margin: 0 0 .06em;
    color: var(--ink);

  .cn-name {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-size: 1.05em; color: var(--text-dim);
    margin: 0 0 .5em; letter-spacing: .12em;

  p {

    font-weight: 300;
    line-height: 1.42;
    margin: 2em 0;
  }
  p:first-of-type { margin-top: 2.6em; }
  strong { font-weight: 600; color: var(--ink); }
  em { font-style: italic; }

  .motto {
    font-size: 1.2em;
    font-weight: 300;
    line-height: 1.42;
    color: var(--ink);
    margin: 1.2rem 0 0;
    letter-spacing: .01em;

  .qr {
    display: block;
    width: 300px;
    max-width: 100%;
    height: auto;
    margin: 0;
    border-radius: 10px;

  a {
    text-decoration: none;
    white-space: nowrap;
    color: var(--ink);
    position: relative;
  }
  a:after {
    content: "";
    position: absolute;
    z-index: -1;
    top: 66%;
    left: -.1em;
    right: -.1em;
    bottom: 0;
    background-color: var(--hl);
    transition: top 200ms cubic-bezier(0, .8, .13, 1), background-color .3s ease;
  }
  a:hover:after { top: 0%; background-color: var(--hl-hover); }

  h2 {
    font-size: .78em;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 3.4em 0 0;
  }

  ul.repos { list-style: none; padding: 0; margin: 1.2em 0 0; max-width: var(--col); }
  ul.repos li {
    padding: .55em 0;
    border-bottom: 1px solid var(--rule);
    font-size: 1.06em; font-weight: 300;
    display: flex; align-items: baseline; justify-content: space-between; gap: 1.2em;

  ul.repos li:last-child { border-bottom: 0; }
  .stars {
    font-size: .82em; color: var(--text-dim);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  ul.prs {
    list-style: none; padding: 0; margin: 1.4em 0 0;
    max-width: var(--col);
  }
  ul.prs > li.pr-group {
    position: relative;
    border-bottom: 1px solid var(--rule);
  }
  ul.prs > li.pr-group:last-child { border-bottom: 0; }

  ul.prs li.pr-row {
    display: grid;
    grid-template-columns: minmax(0, 16em) minmax(0, 1fr) auto;
    align-items: baseline;
    column-gap: 1.4em;
    padding: .52em 0;
    font-size: 1em; font-weight: 300; line-height: 1.45;
  }

  ul.prs .pr-repo {
    display: flex; align-items: baseline; gap: .5em;
    min-width: 0;
    font-size: .86em; color: var(--text-dim);
  }
  ul.prs .pr-repo .pr-repo-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

  ul.prs .pr-t {
    min-width: 0; overflow-wrap: anywhere;

  ul.prs .pr-d {
    font-size: .8em; color: var(--text-dim);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  ul.prs .pr-toggle {
    flex: none;
    display: inline-flex; align-items: center; gap: .28em;
    padding: .1em .42em .12em;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: transparent;
    color: var(--text-dim);

  ul.prs .pr-toggle:hover {

  ul.prs li.pr-group.open .pr-toggle svg { transform: rotate(180deg); }

  ul.prs .pr-subs {
    list-style: none; margin: 0; padding: 0;
    display: none;
  }
  ul.prs li.pr-group.open .pr-subs { display: block; }
  ul.prs .pr-subs > li.pr-sub {
    display: grid;
    grid-template-columns: minmax(0, 16em) minmax(0, 1fr) auto;
    align-items: baseline;
    column-gap: 1.4em;
    padding: .34em 0 .34em 0;
    font-size: .92em; font-weight: 300; line-height: 1.4;

  ul.prs .pr-subs > li.pr-sub:first-child { border-top: 0; }
  ul.prs .pr-subs .pr-repo { padding-left: 1.1em; }
  ul.prs .pr-subs .pr-t a { color: var(--text-dim); }
  ul.prs .pr-subs .pr-t a:hover { color: var(--ink); }

  .counts {
    display: flex; gap: 2.6em; margin: 1.6em 0 0; flex-wrap: wrap;
  }
  .count-num {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 2.6em; line-height: 1; color: var(--ink);
    font-variant-numeric: tabular-nums;

  .count-label { font-size: .8em; color: var(--text-dim); margin-top: .5em; letter-spacing: .04em; }

  footer {
    margin-top: 3.6em; padding-top: 1.4em;
    border-top: 1px solid var(--rule);
    font-size: .88em; color: var(--ink);

    letter-spacing: .01em;

  footer a:hover { color: var(--ink); }

  .reveal { opacity: 0; transform: translateY(10px); }
  .reveal.in {

  @media (max-width: 560px) {

    .top { margin-bottom: 3.2em; }
    p { margin: 1.6em 0; font-size: 1.06em; }
    footer { margin-top: 3em; }
    .counts { gap: 1.8em; }
    .count-num { font-size: 2.1em; }
    ul.prs li.pr-row {

      grid-template-areas:

      row-gap: .1em;
      font-size: .95em;

    ul.prs li.pr-row .pr-repo { grid-area: repo; }
    ul.prs li.pr-row .pr-d { grid-area: date; }
    ul.prs li.pr-row .pr-t { grid-area: title; }
    ul.prs .pr-subs > li.pr-sub {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "repo date"
        "title title";

    }
    ul.prs .pr-subs > li.pr-sub .pr-repo { grid-area: repo; padding-left: 1.1em; }
    ul.prs .pr-subs > li.pr-sub .pr-d { grid-area: date; }
    ul.prs .pr-subs > li.pr-sub .pr-t { grid-area: title; }
  }
</style>

let lang = 'en';
let theme = 'light';

function applyLang(l) {
  lang = I18N[l] ? l : 'en';
  const dict = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = dict[el.getAttribute('data-i18n')];
    if (typeof v === 'string') el.innerHTML = v;
  });
  document.querySelectorAll('[data-lang]').forEach(b => {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
  });
}

function applyTheme(t) {
  theme = (t === 'dark') ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('[data-theme-set]').forEach(b => {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-theme-set') === theme));
  });
}

document.querySelectorAll('[data-lang]').forEach(b => {
  b.addEventListener('click', () => applyLang(b.getAttribute('data-lang')));
});
document.querySelectorAll('[data-theme-set]').forEach(b => {
  b.addEventListener('click', () => applyTheme(b.getAttribute('data-theme-set')));
});

function prLink(repo, n) {
  return 'https://github.com/' + repo + '/pull/' + n;
}

function makeRow(repo, pr, isSub) {
  const li = document.createElement('li');
  li.className = isSub ? 'pr-sub' : 'pr-row';

  const rr = document.createElement('span');
  rr.className = 'pr-repo';
  if (!isSub) {
    const name = document.createElement('span');
    name.className = 'pr-repo-name';
    name.textContent = repo;
    rr.appendChild(name);
  } else {
    const a = document.createElement('a');
    a.href = prLink(repo, pr.n);
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '#' + pr.n;
    rr.appendChild(a);
  }

  const t = document.createElement('span');
  t.className = 'pr-t';
  const a = document.createElement('a');
  a.href = prLink(repo, pr.n);
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = pr.t;
  t.appendChild(a);

  const d = document.createElement('span');
  d.className = 'pr-d';
  d.textContent = pr.d;

  li.appendChild(rr);
  li.appendChild(t);
  li.appendChild(d);
  return li;
}

function renderPRs() {
  const ul = document.getElementById('prList');
  if (!ul) return;
  ul.innerHTML = '';

  REPOS.forEach(group => {
    const li = document.createElement('li');
    li.className = 'pr-group';
    if (group.prs.length > 1) li.classList.add('has-more');

    const row = makeRow(group.r, group.prs[0], false);
    li.appendChild(row);

    if (group.prs.length > 1) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pr-toggle';
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-label', 'Show all ' + group.prs.length + ' pull requests');
      btn.title = 'Show all ' + group.prs.length + ' pull requests';
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">' +
        '<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<span class="pr-count">' + group.prs.length + '</span>';

      const subs = document.createElement('ul');
      subs.className = 'pr-subs';
      group.prs.slice(1).forEach(pr => subs.appendChild(makeRow(group.r, pr, true)));

      btn.addEventListener('click', () => {
        const open = li.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      row.querySelector('.pr-repo').appendChild(btn);
      li.appendChild(subs);
    }

    ul.appendChild(li);
  });
}
renderPRs();

const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });

document.querySelectorAll('.reveal').forEach((el, i) => {
  el.style.transitionDelay = Math.min(i * 55, 300) + 'ms';
  io.observe(el);
});
</script>
